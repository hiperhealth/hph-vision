name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VIRTUALENV_ACTIVATORS: 'bash,python'

jobs:
  check-branch:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-branch-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check if the PR branch is updated
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main "${{ github.event.pull_request.head.sha }}"

  python-api-tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu]
    runs-on: ${{ matrix.os }}-latest
    concurrency:
      group: ci-python-api-${{ matrix.os }}-${{ matrix.python_version }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: hph-vision
          auto-update-conda: true
          conda-solver: libmamba
          python-version: ${{ matrix.python_version }}

      - name: Install Python dependencies
        run: |
          poetry check
          poetry install

      - name: Run API tests
        run: makim api.test

      - name: Run API type checks
        run: makim api.typecheck

  mobile-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    concurrency:
      group: ci-mobile-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: hph-vision
          auto-update-conda: true
          conda-solver: libmamba
          python-version: '3.11'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile library tests and type checks
        run: |
          pnpm --filter @hiperhealth/hphvision-core build
          pnpm --filter @hiperhealth/hphvision-lib test
          pnpm --filter @hiperhealth/hphvision-lib typecheck

      - name: Run mobile app tests and type checks
        run: |
          pnpm --filter @hiperhealth/hphvision test
          pnpm --filter @hiperhealth/hphvision typecheck

  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-linter-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: hph-vision
          auto-update-conda: true
          conda-solver: libmamba
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Verify Node and Python tools
        run: |
          pnpm --version
          ruff --version

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install
          pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @hiperhealth/hphvision-core build

      - name: Run style checks
        if: success() || failure()
        run: |
          pre-commit install
          makim all.lint

      - name: Setup tmate session
        if: "${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci:enable-debugging')) }}"
        uses: mxschmitt/action-tmate@v3
